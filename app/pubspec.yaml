name: market_app
description: A portfolio dashboard for Indian stocks and Bitcoin.
publish_to: 'none'
version: 2.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # HTTP networking — calls our FastAPI backend
  http: ^1.2.1

  # Charts — line charts for SIP, pie/donut for sector heatmap
  fl_chart: ^0.68.0

  # Biometric authentication — fingerprint / Face ID for reveal balances
  local_auth: ^2.2.0

  # Icons
  cupertino_icons: ^1.0.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
